# AETHER Configuration
# All values shown are defaults. Uncomment and modify as needed.

llm:
  model: "deepseek/deepseek-v3.2-exp"
  base_url: "https://openrouter.ai/api/v1"
  # api_key: set via OPENROUTER_API_KEY env var or config/.env
  timeout: 120.0
  max_retries: 3

pipeline:
  total_iterations: 4
  revision_iterations: 3
  max_concurrent_requests: 5

clause:
  num_trees: 5
  max_depth: 3
  period: 10
  num_edges: 500
  max_iterations: 10000
  sim_threshold: 0.2
  weight_threshold: 0.05
  min_signal_ratio: 0.10
  max_signal_ratio: 0.50

data:
  ticker: "BTCUSDT"
  end_date: "2025-01-01"
  data_dir: "data"
  database_dir: "database"

agent:
  react_max_iterations: 10
  tool_timeout: 180
