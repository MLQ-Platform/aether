[tool.poetry]
name = "aether"
version = "0.1.0"
description = "Data-driven Hypothesis Generation Engine"
authors = ["Yang-Hyun-Jun <sugumy@naver.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
anytree = "^2.13.0"
numpy = "^2.3.2"
pandas = "^2.3.2"
tqdm = "^4.67.1"
pyarrow = "^21.0.0"
matplotlib = "^3.10.6"
networkx = "^3.5"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = [
    "F401",  
    "I001",
]

[tool.ruff.lint.isort]
force-single-line = true
no-lines-before = [
    "standard-library", 
    "third-party", 
    "first-party", 
    "local-folder"
    ]

