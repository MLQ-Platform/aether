[tool.poetry]
name = "aether"
version = "0.2.0"
description = "Data-driven Hypothesis Generation Engine"
authors = ["Yang-Hyun-Jun <sugumy@naver.com>"]
readme = "README.md"

[tool.poetry.scripts]
aether = "aether.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
anytree = "^2.13.0"
numpy = "^2.3.2"
pandas = "^2.3.2"
pyarrow = "^21.0.0"
networkx = "^3.5"
openai = "^2.1.0"
pydantic = "^2.0.0"
dotenv = "^0.9.9"
pyyaml = "^6.0"
scipy = "^1.16.3"
loguru = "^0.7.3"
typer = ">=0.9.0"
rich = "^13.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"
pytest = "^8.0"
pytest-asyncio = ">=0.23.0"
matplotlib = "^3.10.6"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "F401",
    "I001",
]

[tool.ruff.lint.isort]
force-single-line = true
no-lines-before = [
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
    ]
